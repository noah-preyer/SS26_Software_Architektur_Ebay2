services:
  product-service:
    build: .
    networks:
      - app-net
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://product-db:5432/productdb
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app_password
    depends_on:
      product-db:
        condition: service_healthy
    deploy:
      replicas: 3

  product-service-proxy:
    container_name: product_service_proxy
    image: nginx:alpine
    networks:
      - app-net
    volumes:
      - ./nginx/product-service.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - product-service

  product-db:
    container_name: product_service_db
    image: postgres:16
    networks:
      - app-net
    environment:
      POSTGRES_DB: productdb
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
    volumes:
      - prod_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d productdb"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  app-net:
    name: app-net

volumes:
  prod_pgdata:
