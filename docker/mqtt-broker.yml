services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker
    expose:
      - "1883"
      - "9001"
    networks:
      - app-net
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/broker/uptime' -C 1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  app-net:
    name: app-net
