include:
  - frontend/docker-compose.yml
  - product_service/docker-compose.yml
  - auth_service/docker-compose.yml
  - order_service/docker-compose.yml
  - user_service/docker-compose.yml
  - email_service/docker-compose.yml

networks:
  app-net:
    name: app-net

services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker
    expose:
      - "1883"
      - "9001"
    networks:
      - app-net
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/broker/uptime' -C 1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-gateway:
    container_name: api-gateway
    build: ./api_gateway
    networks:
      - app-net
    depends_on:
      - product-service
      - auth-service
      - user-service
      - order-service
      - email-service

