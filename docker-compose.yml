include:
  - docker/mqtt-broker.yml
  - frontend/docker-compose.yml
  - product_service/docker-compose.yml
  - auth_service/docker-compose.yml
  - order_service/docker-compose.yml
  - user_service/docker-compose.yml
  - email_service/docker-compose.yml

networks:
  app-net:
    name: app-net

services:
  api-gateway:
    container_name: api-gateway
    build: ./api_gateway
    networks:
      - app-net
    depends_on:
      - product-service
      - auth-service
      - user-service
      - order-service
      - email-service

